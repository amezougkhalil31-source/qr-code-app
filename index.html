<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QR Master Pro - Production Edition</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome Pro Icons for Modern Buttons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- App Toast Notification System (Live Feedback) -->
    <div id="toast-notification" class="toast-notification hidden">
        <i class="fa-solid fa-circle-check" id="toast-icon"></i>
        <span id="toast-message">Action completed successfully!</span>
    </div>

    <!-- Top Professional Navigation Bar -->
    <header class="app-navbar">
        <div class="nav-brand">
            <div class="brand-icon">
                <i class="fa-solid fa-qrcode"></i>
            </div>
            <span class="brand-title">QR Master Pro</span>
        </div>
        <div class="nav-actions">
            <button id="theme-toggle-btn" class="icon-btn" aria-label="Toggle Theme" title="Switch Theme">
                <i class="fa-solid fa-moon"></i>
            </button>
        </div>
    </header>

    <!-- Main Application Interface -->
    <main class="app-main-container">
        
        <!-- Input Control Panel Card -->
        <section class="app-card control-card">
            <div class="card-header">
                <h2><i class="fa-solid fa-wand-magic-sparkles"></i> Generator Hub</h2>
                <p>Create high-performance QR codes for production & store deployment.</p>
            </div>

            <div class="input-group">
                <label for="qr-text">
                    <i class="fa-solid fa-link"></i> Target URL or Secure Text
                </label>
                <div class="input-wrapper">
                    <input type="text" id="qr-text" placeholder="https://yourwebsite.com" autocomplete="off" spellcheck="false">
                    <button id="clear-input-btn" class="clear-btn" title="Clear Text"><i class="fa-solid fa-xmark"></i></button>
                </div>
            </div>

            <div class="settings-row">
                <div class="input-group">
                    <label for="qr-size">
                        <i class="fa-solid fa-expand"></i> Resolution Size
                    </label>
                    <select id="qr-size">
                        <option value="150">Standard (150 x 150 px)</option>
                        <option value="250" selected>High Definition (250 x 250 px)</option>
                        <option value="350">Ultra HD (350 x 350 px)</option>
                    </select>
                </div>
            </div>

            <!-- Modern Realistic Action Buttons -->
            <div class="button-group-main">
                <button id="generate-btn" class="btn-modern btn-primary-action">
                    <span class="btn-content">
                        <i class="fa-solid fa-bolt"></i> Generate QR Code
                    </span>
                </button>
            </div>
        </section>

        <!-- Dynamic Live Result Card -->
        <section class="app-card result-card hidden" id="result-card">
            <div class="result-header">
                <h3><i class="fa-solid fa-square-check"></i> Your QR Code is Ready</h3>
                <span class="badge-status">Active</span>
            </div>

            <div class="qr-preview-box">
                <div class="qr-canvas-holder" id="qr-code"></div>
            </div>

            <div class="action-buttons-grid">
                <button id="download-btn" class="btn-modern btn-secondary-action">
                    <i class="fa-solid fa-download"></i> Download PNG
                </button>
                <button id="share-btn" class="btn-modern btn-tertiary-action">
                    <i class="fa-solid fa-share-nodes"></i> Share Code
                </button>
            </div>
        </section>

    </main>

    <!-- Professional Footer Info -->
    <footer class="app-footer">
        <p>QR Master Pro &bull; Production Ready for Google Play</p>
    </footer>

    <!-- Core QR Engine Library & Application Logic -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
