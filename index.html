<!DOCTYPE html>
<html lang="fr" data-theme="dark" data-theme-color="indigo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Master Pro</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">
    <!-- Manifest PWA -->
    <link rel="manifest" href="manifest.json">
</head>
<body>

    <!-- الهيدر العلوي -->
    <header class="app-header">
        <button id="menu-toggle-btn" class="icon-btn" aria-label="Menu">
            <i class="fa-solid fa-bars"></i>
        </button>
        <h1 class="app-title">QR Master Pro</h1>
        <button id="share-app-btn" class="icon-btn" aria-label="Partager">
            <i class="fa-solid fa-share-nodes"></i>
        </button>
    </header>

    <!-- القائمة الجانبية (الإعدادات) -->
    <div id="drawer-overlay" class="drawer-overlay"></div>
    <aside id="settings-drawer" class="settings-drawer">
        <div class="drawer-header">
            <h2>Paramètres</h2>
            <button id="close-drawer-btn" class="icon-btn"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="drawer-content">
            <div class="setting-item">
                <span>Thème</span>
                <div class="theme-buttons">
                    <button id="light-mode-btn" class="theme-btn"><i class="fa-solid fa-sun"></i></button>
                    <button id="dark-mode-btn" class="theme-btn active"><i class="fa-solid fa-moon"></i></button>
                </div>
            </div>
            <div class="setting-item">
                <span>Couleur principale</span>
                <div class="color-picker-dots">
                    <span class="color-dot active" data-color="indigo" style="background: #4f46e5;"></span>
                    <span class="color-dot" data-color="blue" style="background: #0284c7;"></span>
                    <span class="color-dot" data-color="emerald" style="background: #10b981;"></span>
                    <span class="color-dot" data-color="rose" style="background: #f43f5e;"></span>
                    <span class="color-dot" data-color="amber" style="background: #f59e0b;"></span>
                </div>
            </div>
        </div>
    </aside>

    <!-- المحتوى الرئيسي (الصفحات) -->
    <main class="app-main">

        <!-- 1. واجهة الاستقبال (Home) -->
        <section id="home-section" class="page-section active">
            <div class="hero-card">
                <h2>Bienvenue sur QR Master Pro</h2>
                <p>Générez et scannez tous vos QR codes en toute simplicité et rapidité.</p>
                <div class="hero-actions">
                    <button id="goto-generator-btn" class="primary-btn"><i class="fa-solid fa-qrcode"></i> Créer un QR Code</button>
                    <button id="goto-scanner-btn" class="secondary-btn"><i class="fa-solid fa-camera"></i> Scanner un QR Code</button>
                </div>
            </div>
        </section>

        <!-- 2. واجهة التوليد (Generator) -->
        <section id="generator-section" class="page-section">
            <div class="section-header">
                <h2>Générateur de QR Code</h2>
            </div>
            
            <!-- قائمة اختيار نوع الـ QR -->
            <div id="types-menu-view" class="types-grid">
                <button class="type-item-btn" data-type="url"><i class="fa-solid fa-link"></i><span>URL</span></button>
                <button class="type-item-btn" data-type="text"><i class="fa-solid fa-font"></i><span>Texte</span></button>
                <button class="type-item-btn" data-type="contact"><i class="fa-solid fa-address-book"></i><span>Contact</span></button>
                <button class="type-item-btn" data-type="email"><i class="fa-solid fa-envelope"></i><span>Email</span></button>
                <button class="type-item-btn" data-type="sms"><i class="fa-solid fa-comment-sms"></i><span>SMS</span></button>
                <button class="type-item-btn" data-type="coordinates"><i class="fa-solid fa-location-dot"></i><span>GPS</span></button>
                <button class="type-item-btn" data-type="phone"><i class="fa-solid fa-phone"></i><span>Téléphone</span></button>
                <button class="type-item-btn" data-type="wifi"><i class="fa-solid fa-wifi"></i><span>Wi-Fi</span></button>
                <button class="type-item-btn" data-type="agenda"><i class="fa-solid fa-calendar"></i><span>Agenda</span></button>
                <button class="type-item-btn" data-type="clipboard"><i class="fa-solid fa-clipboard"></i><span>Presse-papiers</span></button>
            </div>

            <!-- نموذج إدخال البيانات للـ QR -->
            <div id="dynamic-form-view" class="dynamic-form-card" style="display: none;">
                <div class="form-nav-top">
                    <button id="back-to-menu-btn" class="icon-btn"><i class="fa-solid fa-arrow-right"></i></button>
                    <h3 id="form-title-text">Contenu</h3>
                </div>
                
                <div id="form-inputs-container" class="form-inputs">
                    <!-- يتم تعبئة الحقول ديناميكياً عبر السكريبت -->
                </div>

                <div class="input-group" style="margin-top: 15px;">
                    <label>Taille du QR Code (Pixels)</label>
                    <select id="qr-size" class="form-control">
                        <option value="200">200x200 (Petit)</option>
                        <option value="300" selected>300x300 (Moyen)</option>
                        <option value="500">500x500 (Grand)</option>
                    </select>
                </div>

                <button id="generate-custom-btn" class="primary-btn" style="width: 100%; margin-top: 20px;">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> Générer le QR Code
                </button>

                <div id="qr-result" class="qr-result-box" style="text-align: center; margin-top: 20px;"></div>
            </div>
        </section>

        <!-- 3. واجهة الماسح الضوئي (Scanner) -->
        <section id="scanner-section" class="page-section">
            <div class="scanner-container">
                <div id="reader"></div>
                <div class="scanner-actions-bar">
                    <button id="flip-camera-btn" class="scanner-tool-btn" title="Changer de caméra"><i class="fa-solid fa-camera-rotate"></i></button>
                    <button id="gallery-btn" class="scanner-tool-btn" title="Importer depuis la galerie"><i class="fa-solid fa-image"></i></button>
                    <input type="file" id="gallery-file-input" accept="image/*" style="display: none;">
                </div>
            </div>

            <!-- نافذة عرض نتيجة السكان -->
            <div id="scan-result-screen" class="scan-result-modal">
                <div class="scan-result-content">
                    <div class="scan-result-header">
                        <span id="scan-result-category" class="badge">URL</span>
                        <button id="close-scan-result-btn" class="icon-btn"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                    <h3 id="scan-result-type-title">Lien Web</h3>
                    <p id="scan-result-text" class="result-text-box"></p>
                    <div class="scan-modal-actions">
                        <button id="scan-main-action-btn" class="primary-btn">Ouvrir</button>
                        <div class="secondary-actions">
                            <button id="scan-action-copy" class="secondary-btn"><i class="fa-solid fa-copy"></i> Copier</button>
                            <button id="scan-action-share" class="secondary-btn"><i class="fa-solid fa-share-nodes"></i> Partager</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- الشريط السفلي للتنقل -->
    <nav class="app-nav-bar">
        <button class="nav-item" data-target="home">
            <i class="fa-solid fa-house"></i>
            <span>Accueil</span>
        </button>
        <button class="nav-item" data-target="generator">
            <i class="fa-solid fa-qrcode"></i>
            <span>Créer</span>
        </button>
        <button class="nav-item active" data-target="scanner">
            <i class="fa-solid fa-camera"></i>
            <span>Scanner</span>
        </button>
    </nav>

    <!-- Html5-Qrcode Library Script -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <!-- Main Script -->
    <script src="script.js"></script>
</body>
</html>
